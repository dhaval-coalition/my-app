<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quote Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h2 { margin-top: 0; color: #4f46e5; }
    p { font-size: 1.1rem; line-height: 1.5; min-height: 60px; display: flex; align-items: center; justify-content: center; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h2>✨ Quick Quote</h2>
    <p id="quote">Click the button to get inspired!</p>
    <button onclick="generateQuote()">New Quote</button>
  </div>

  <script>
    const quotes = [
      "The best time to plant a tree was 20 years ago. The second best time is now.",
      "Your time is limited, so don't waste it living someone else's life.",
      "Action is the foundational key to all success.",
      "Everything you’ve ever wanted is on the other side of fear."
    ];

    function generateQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById('quote').innerText = quotes[randomIndex];
    }
  </script>
</body>
</html>
